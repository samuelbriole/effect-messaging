packages:
  - packages/*
  - tools/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

allowBuilds:
  dprint: false
  esbuild: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@dprint/android-arm64@0.58.0'
  - '@dprint/android-x64@0.58.0'
  - '@dprint/darwin-arm64@0.58.0'
  - '@dprint/darwin-x64@0.58.0'
  - '@dprint/linux-arm64-glibc@0.58.0'
  - '@dprint/linux-arm64-musl@0.58.0'
  - '@dprint/linux-loong64-glibc@0.58.0'
  - '@dprint/linux-loong64-musl@0.58.0'
  - '@dprint/linux-ppc64-glibc@0.58.0'
  - '@dprint/linux-ppc64-musl@0.58.0'
  - '@dprint/linux-riscv64-glibc@0.58.0'
  - '@dprint/linux-x64-glibc@0.58.0'
  - '@dprint/linux-x64-musl@0.58.0'
  - '@dprint/win32-arm64@0.58.0'
  - '@dprint/win32-x64@0.58.0'
  - '@effect/tsgo-darwin-arm64@0.47.2'
  - '@effect/tsgo-darwin-x64@0.47.2'
  - '@effect/tsgo-linux-arm64@0.47.2'
  - '@effect/tsgo-linux-arm@0.47.2'
  - '@effect/tsgo-linux-x64@0.47.2'
  - '@effect/tsgo-win32-arm64@0.47.2'
  - '@effect/tsgo-win32-x64@0.47.2'
  - '@effect/tsgo@0.47.2'
  - dprint@0.58.0
  - '@effect/docgen@4.0.0'
  - '@effect/platform-node-shared@4.0.0'
  - '@effect/platform-node@4.0.0'
  - '@effect/vitest@4.0.0'
  - '@vitest/coverage-v8@5.0.3'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - effect@4.0.0
  - vitest@5.0.3
